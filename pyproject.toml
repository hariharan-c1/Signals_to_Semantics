[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signals-to-semantics"
version = "1.0.0"
description = "Traceable ADAS/AD scenario mining from vehicle signals to semantic retrieval"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Hariharan Chandrasekaran", email = "hariharan.chandrasekaran25@gmail.com"}
]
keywords = [
  "autonomous-driving",
  "scenario-discovery",
  "positive-unlabeled-learning",
  "graph-neural-networks",
  "large-language-models",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
data = [
  "av2==0.3.5",
  "pandas>=2.1,<3",
  "pyarrow>=14,<21",
  "shapely>=2,<3",
  "tqdm>=4.66,<5",
]
ml = [
  "pandas>=2.1,<3",
  "pyarrow>=14,<21",
  "scikit-learn>=1.3,<2",
  "torch>=2.2,<3",
  "torch-geometric>=2.5,<3",
  "xgboost>=2,<4",
]
llm = [
  "openai>=1.50,<3",
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
]
database = [
  "psycopg2-binary>=2.9,<3",
  "python-dotenv>=1,<2",
  "SQLAlchemy>=2,<3",
]
viz = [
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "umap-learn>=0.5,<1",
]
dev = [
  "pytest>=8,<9",
]
full = [
  "av2==0.3.5",
  "matplotlib>=3.8,<4",
  "openai>=1.50,<3",
  "pandas>=2.1,<3",
  "psycopg2-binary>=2.9,<3",
  "pyarrow>=14,<21",
  "python-dotenv>=1,<2",
  "requests>=2.31,<3",
  "scikit-learn>=1.3,<2",
  "seaborn>=0.13,<1",
  "shapely>=2,<3",
  "SQLAlchemy>=2,<3",
  "torch>=2.2,<3",
  "torch-geometric>=2.5,<3",
  "tqdm>=4.66,<5",
  "umap-learn>=0.5,<1",
  "xgboost>=2,<4",
]

[project.scripts]
sts = "signals_to_semantics.cli:main"

[project.urls]
Homepage = "https://github.com/hariharan-c1/Signals_to_Semantics"
Repository = "https://github.com/hariharan-c1/Signals_to_Semantics"
Issues = "https://github.com/hariharan-c1/Signals_to_Semantics/issues"
LinkedIn = "https://www.linkedin.com/in/hariharan-chandrasekaran-/"

[tool.setuptools.packages.find]
include = ["signals_to_semantics*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
